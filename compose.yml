services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${DB_NAME:-itme_arena}
      POSTGRES_USER: ${DB_USER:-itme}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ADMOB_REWARDED_UNIT: ${ADMOB_REWARDED_UNIT:-}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-itme_arena}
      DB_USER: ${DB_USER:-itme}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
